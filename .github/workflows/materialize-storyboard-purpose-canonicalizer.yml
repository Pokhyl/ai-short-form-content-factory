name: Materialize storyboard purpose canonicalizer
on:
  push:
    branches:
      - transport/storyboard-purpose-canonicalizer-20260911
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact purpose canonicalizer
        shell: bash
        run: |
          set -euo pipefail
          PARENT=7a529ff81ac49faf9e8d28dfd15d53196c949c57
          TARGET_TREE=69eb6d88fa51f180d8e03f538f1e7da0c75987a3
          RESULT=transport/storyboard-purpose-canonicalizer-result-20260911
          if git ls-remote --exit-code --heads origin "$RESULT" >/dev/null 2>&1; then
            echo "result branch already exists" >&2
            exit 1
          fi
          git checkout --detach "$PARENT"
          test "$(git hash-object n8n/workflows/WF02-plan-script-and-scenes.json)" = "644f736ea00364d94fcbf51eb6b5c5b04c208395"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('n8n/workflows/WF02-plan-script-and-scenes.json')
          s=p.read_text()
          old1="const list=v=>Array.isArray(v)?v:(typeof v==='string'&&clean(v)?[v]:[]);const validEvidence=new Set(base.research_rows.map(x=>x.id)),purposes=new Set(['hook','establish','explain','proof','example','transition','close']),reps="
          new1="const list=v=>Array.isArray(v)?v:(typeof v==='string'&&clean(v)?[v]:[]);const validEvidence=new Set(base.research_rows.map(x=>x.id)),purposes=new Set(['hook','establish','explain','proof','example','transition','close']),canonicalPurpose=v=>{const raw=clean(v).toLowerCase();if(purposes.has(raw))return raw;const parts=raw.split('|').map(clean).filter(Boolean);return parts.length>1&&parts.every(x=>purposes.has(x))?parts[0]:raw;},reps="
          old2="purpose=clean(s.purpose),narration_intent=clean(s.narration_intent)"
          new2="purpose=canonicalPurpose(s.purpose),narration_intent=clean(s.narration_intent)"
          assert s.count(old1)==1
          assert s.count(old2)==1
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          data=''
          Path('tests/v6_storyboard_purpose_canonicalization_regression.mjs').write_bytes(base64.b64decode(data))
          PY
          test "$(git hash-object n8n/workflows/WF02-plan-script-and-scenes.json)" = "a7e0d18aad229e030833a06e506e395763745633"
          test "$(git hash-object tests/v6_storyboard_purpose_canonicalization_regression.mjs)" = "2809ee3bc4c2177d6f0965de170f3d5ada8dcac4"
          git add n8n/workflows/WF02-plan-script-and-scenes.json tests/v6_storyboard_purpose_canonicalization_regression.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: canonicalize compound storyboard purpose'
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git push origin "HEAD:refs/heads/$RESULT"
