name: Materialize blocked-decode V6 docs checkpoint

on:
  push:
    branches:
      - transport/v6-duration-decode-docs-20260911

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact docs patch
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.transport/v6-duration-decode-docs.patch" > /tmp/v6-duration-decode-docs.patch
          echo 'fc785a02d6b7594a73e12429f62d9a76532e9dbce273e9cfd7960cef778b9ab5  /tmp/v6-duration-decode-docs.patch' | sha256sum -c -
          if git ls-remote --exit-code --heads origin refs/heads/transport/v6-duration-decode-docs-result-20260911 >/dev/null 2>&1; then
            echo 'result branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout --detach fa8523a8e738df9cc1b81ec3fe7d261f23c662e0
          git apply --check /tmp/v6-duration-decode-docs.patch
          git apply /tmp/v6-duration-decode-docs.patch
          test "$(git hash-object docs/CURRENT_STATE_V5.md)" = fc19c8b2ff7d773ccd20df8839deb83ab9330608
          test "$(git hash-object docs/FAILURE_LEDGER.md)" = 4a8370b48061cc554d8be799fc93071ca88e97a4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md docs/FAILURE_LEDGER.md
          git commit -m 'docs: record blocked execution decode'
          test "$(git rev-parse HEAD^{tree})" = 331b58890f6725bc84044dd9db9df39a915ed212
          git push origin HEAD:refs/heads/transport/v6-duration-decode-docs-result-20260911
