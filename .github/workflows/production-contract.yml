name: Production Contract

on:
  push:
    branches: [rebuild/agentic-editor-v5]
  pull_request:
    branches: [rebuild/agentic-editor-v5]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-quota production dependency contract
        run: |
          node tests/production_dependency_contract_regression.mjs
          node tests/model_worker_ollama_contract_regression.mjs
      - name: Run static Node regressions
        run: |
          set -euo pipefail
          count=0
          for f in tests/*.mjs; do
            [ "$f" = "tests/semantic_visual_real_provider_dry_run.mjs" ] && continue
            node "$f"
            count=$((count+1))
          done
          echo "Node regressions: $count"
      - name: Run Python regressions
        run: |
          set -euo pipefail
          count=0
          for f in tests/*.py; do
            python3 "$f"
            count=$((count+1))
          done
          echo "Python regressions: $count"
      - name: Validate workflow JSON
        run: |
          python3 - <<'PY'
          import glob,json
          for path in glob.glob('n8n/workflows/*.json') + ['config/production-dependency-policy.json']:
              with open(path, encoding='utf-8') as fh:
                  json.load(fh)
          print('JSON validation: PASS')
          PY
      - name: Build self-hosted model worker
        run: docker build -t asfc-model-worker-contract ./services/model-worker
