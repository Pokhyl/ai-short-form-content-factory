name: Temporary provider finish-contract transport

on:
  push:
    branches:
      - tmp/provider-finish-contract-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply verified provider finish-contract patch
        shell: bash
        run: |
          set -euo pipefail
          expected=a5bafcd96f69936f51439b0298c23dfc9705874e
          expected_tree=a6bfe9de9639fcac8fa840972ad283530849a97f
          test "$(git rev-parse HEAD)" = "$expected"
          git config user.name Vitalii
          git config user.email 84464769+Pokhyl@users.noreply.github.com
          cat > /tmp/fix.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          git am /tmp/fix.patch
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/model_gateway_bounded_recovery_regression.mjs
          git diff --check HEAD^ HEAD
          git push origin HEAD:rebuild/agentic-editor-v5
