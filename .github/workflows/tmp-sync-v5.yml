name: Temporary V5 source sync

on:
  push:
    branches:
      - rebuild/agentic-editor-v5
    paths:
      - .github/workflows/tmp-sync-v5.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0

      - name: Download exact tested source package
        run: |
          set -euo pipefail
          curl -fL --retry 2 --retry-delay 2 'https://publisher.hodor.com.pl/chat-share-4d7f9c2a/sync-20260905-1612-7f3b2c.tar.gz?v=2' -o /tmp/v5-sync.tar.gz
          echo '20e4cfb8918e7be42a9aa4fbc8f7ec15ade58fb2a2f7995447afb3125a97fc29  /tmp/v5-sync.tar.gz' | sha256sum -c -

      - name: Apply tested source and remove helper
        run: |
          set -euo pipefail
          tar -xzf /tmp/v5-sync.tar.gz -C .
          rm -f .github/workflows/tmp-sync-v5.yml
          git config user.name 'Vitalii'
          git config user.email '84464769+Pokhyl@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md \
            n8n/workflows/V4-model-gateway.json \
            n8n/workflows/WF02-plan-script-and-scenes.json \
            n8n/workflows/WF03-natural-edge-voice.json \
            n8n/workflows/WF04-visual-sourcing.json \
            tests/model_gateway_bounded_recovery_regression.mjs \
            tests/wf03_duration_gateway_fallback_regression.mjs \
            tests/wf03_final_visual_rebind_regression.mjs \
            .github/workflows/tmp-sync-v5.yml
          git diff --cached --check
          git commit -m 'fix: bind visuals to final timed narration'
          git push origin HEAD:rebuild/agentic-editor-v5
