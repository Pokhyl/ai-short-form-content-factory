name: Temporary reviewer exposure transport
on:
  push:
    branches:
      - tmp/reviewer-exposure-20260906
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/reviewer-exposure-20260906
          fetch-depth: 0
      - name: Apply verified reviewer exposure patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/reviewer-exposure-01.txt .transport/reviewer-exposure-02.txt .transport/reviewer-exposure-03.txt > /tmp/reviewer-exposure.b64
          git fetch origin rebuild/agentic-editor-v5
          git checkout -B transport-target origin/rebuild/agentic-editor-v5
          test "$(git rev-parse HEAD)" = "2e649032bab9a68cc1b3784cfd58dc80f3735230"
          base64 -d /tmp/reviewer-exposure.b64 | xz -d > /tmp/reviewer-exposure.patch
          git config user.name Vitalii
          git config user.email 84464769+Pokhyl@users.noreply.github.com
          git am /tmp/reviewer-exposure.patch
          test "$(git rev-parse HEAD^{tree})" = "3292e8c9a439db642758f7219543fd0db3394854"
          node tests/wf04_photo_relevance_gate_regression.mjs
          node tests/wf04_global_no_repeat_recovery_regression.mjs
          git push origin HEAD:rebuild/agentic-editor-v5
