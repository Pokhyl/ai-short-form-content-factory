name: Materialize WF03 duration unit docs v3
on:
  push:
    branches:
      - transport/wf03-duration-unit-docs-20260911
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact docs checkpoint v3
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.transport/wf03-duration-unit-docs-20260911.patch
          EXPECTED_STORED_SHA=e3bf168fd5c97eb52f12afa21b5ca1a51afd98ee007876e4d62e0e075f3b4142
          PARENT=3ae59103a3b3aa02fe33a3c1c26a47bc07615435
          TARGET_TREE=98bde365226f19e327b4ad2b719b3b9dcaa3c09c
          CURRENT_BLOB=2d63adf549735d0e7b12d3f1f23ef2f69ab71b71
          LEDGER_BLOB=3f642a954819633c9cd4aa38772e3dc7172b5bbe
          RESULT=transport/wf03-duration-unit-docs-result-v3-20260911
          git show "$GITHUB_SHA:$PATCH" > /tmp/stored.patch
          echo "$EXPECTED_STORED_SHA  /tmp/stored.patch" | sha256sum -c -
          cp /tmp/stored.patch /tmp/change.patch
          printf '\n' >> /tmp/change.patch
          if git ls-remote --exit-code --heads origin "$RESULT" >/dev/null 2>&1; then
            echo "result branch already exists" >&2
            exit 1
          fi
          git checkout --detach "$PARENT"
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          test "$(git hash-object docs/CURRENT_STATE_V5.md)" = "$CURRENT_BLOB"
          test "$(git hash-object docs/FAILURE_LEDGER.md)" = "$LEDGER_BLOB"
          git add docs/CURRENT_STATE_V5.md docs/FAILURE_LEDGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: checkpoint WF03 regression scope'
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git push origin "HEAD:refs/heads/$RESULT"
