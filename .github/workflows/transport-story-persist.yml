name: Transport verified story persistence fix

on:
  push:
    branches:
      - transport/story-persist-20260907

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply exact verified patch and push
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='86d018eb808aba98d8f03cf8d47a719539618c5f'
          expected_tree='56db7124f3a384f5674e462f914f089f0e51bf74'
          test "$(git rev-parse HEAD)" = "$expected_parent"
          printf '%s' '' | base64 -d > /tmp/change.patch
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git diff --check
          git add docs/CURRENT_STATE_V5.md n8n/workflows/WF02-plan-script-and-scenes.json tests/postgres_credentials_contract_regression.mjs
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'HODOR'
          git config user.email 'hodor@MacBook-Air-HODOR.local'
          git commit -m 'fix: require postgres credentials for persisted story'
          git push origin HEAD:rebuild/agentic-editor-v5
