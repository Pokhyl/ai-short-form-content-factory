name: Exact humanfail blob materializer

on:
  push:
    branches:
      - transport/humanfail-blobs-20260908

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified two-file patch and materialize exact blobs
        shell: bash
        run: |
          set -euo pipefail
          patch_ref="$GITHUB_SHA"
          git show "$patch_ref:.transport/humanfail-two-blobs.patch" > /tmp/humanfail-two-blobs.patch
          if git ls-remote --exit-code --heads origin refs/heads/transport/humanfail-result-20260908 >/dev/null 2>&1; then
            echo 'result branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout --detach 3e84e8a748b296a3fd40ac33517efd6004de8ee0
          git apply --check /tmp/humanfail-two-blobs.patch
          git apply /tmp/humanfail-two-blobs.patch
          server_blob=$(git hash-object services/media-worker/src/server.mjs)
          state_blob=$(git hash-object docs/CURRENT_STATE_V5.md)
          test "$server_blob" = 27fb4ae203746afab4d2c6e8a320b4205f1c5dd8
          test "$state_blob" = aa9c9ff0e86c4148189946904c926ed2c89dd51d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/media-worker/src/server.mjs docs/CURRENT_STATE_V5.md
          git commit -m 'transport: materialize exact verified humanfail blobs'
          result_commit=$(git rev-parse HEAD)
          result_tree=$(git rev-parse HEAD^{tree})
          echo "server_blob=$server_blob"
          echo "state_blob=$state_blob"
          echo "result_commit=$result_commit"
          echo "result_tree=$result_tree"
          git push origin HEAD:refs/heads/transport/humanfail-result-20260908
