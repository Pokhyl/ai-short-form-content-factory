name: Exact inventory deployment state materializer

on:
  push:
    branches:
      - transport/humanfail-blobs-20260908

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact deployment-state patch
        shell: bash
        run: |
          set -euo pipefail
          patch_ref="$GITHUB_SHA"
          git show "$patch_ref:.transport/inventory-deploy-doc.patch.gz.b64" | base64 -d | gzip -dc > /tmp/inventory-deploy-doc.patch
          echo '91ef21c5b0a4cb0a3ff9bb5a1dfc3da9122d2a86c6518d7255e1314810c616d4  /tmp/inventory-deploy-doc.patch' | sha256sum -c -
          if git ls-remote --exit-code --heads origin refs/heads/transport/inventory-deploy-result-20260908 >/dev/null 2>&1; then
            echo 'result branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout --detach 866cfcb610f8d7463cbd03c2768e61ded5ca05ea
          git apply --check /tmp/inventory-deploy-doc.patch
          git apply /tmp/inventory-deploy-doc.patch
          test "$(git hash-object docs/CURRENT_STATE_V5.md)" = 379f8e56fc4f917f10cd80e7233140f441e95e73
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md
          git commit -m 'docs: record visual inventory deployment'
          result_commit=$(git rev-parse HEAD)
          result_tree=$(git rev-parse HEAD^{tree})
          test "$result_tree" = 4c596fc0b528dbef43fdf9a8f75ca4162ae5f12f
          echo "result_commit=$result_commit"
          echo "result_tree=$result_tree"
          git push origin HEAD:refs/heads/transport/inventory-deploy-result-20260908
