name: Temporary provider recovery transport

on:
  push:
    branches:
      - tmp/provider-recovery-transport-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply verified local commit patch
        shell: bash
        run: |
          set -euo pipefail
          expected=8ed8a080f8feacedc57c351f0b127d4847045b7b
          test "$(git rev-parse HEAD)" = "$expected"
          cat > /tmp/provider-recovery.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/provider-recovery.patch.gz.b64 | gzip -d > /tmp/provider-recovery.patch
          git apply --check /tmp/provider-recovery.patch
          git apply /tmp/provider-recovery.patch
          git diff --check
          python3 - <<'PY'
          import glob,json
          for path in glob.glob('n8n/workflows/*.json'):
              json.load(open(path))
          print('WORKFLOW_JSON_PASS')
          PY
          for f in tests/*.py; do python3 "$f"; done
          for f in tests/*.mjs; do
            case "$f" in *semantic_visual_real_provider_dry_run.mjs) continue;; esac
            node "$f"
          done
          git config user.name 'Vitalii'
          git config user.email '84464769+Pokhyl@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md n8n/workflows/V4-model-gateway.json n8n/workflows/WF04-visual-sourcing.json services/media-worker/src/server.mjs services/media-worker/src/visual-discovery.mjs tests/model_gateway_bounded_recovery_regression.mjs tests/visual_conflict_recovery_exact_query_regression.mjs tests/wf04_global_no_repeat_recovery_regression.mjs
          git commit -m 'fix: add free model failover and visual conflict recovery'
          git push origin HEAD:rebuild/agentic-editor-v5
          echo "transport_commit=$(git rev-parse HEAD)"
          echo "transport_tree=$(git rev-parse HEAD^{tree})"
