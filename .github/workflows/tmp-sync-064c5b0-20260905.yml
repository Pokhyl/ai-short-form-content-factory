name: Temporary exact visual and audio sync

on:
  push:
    branches:
      - rebuild/agentic-editor-v5
    paths:
      - .github/workflows/tmp-sync-064c5b0-20260905.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 1
      - name: Apply tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://publisher.hodor.com.pl/chat-share-4d7f9c2a/sync-064c5b0-f3c91a.tar.gz -o /tmp/source.tar.gz
          echo '3813418a71933596a99b6dcc8e48e9b8dc9aea656952c90709530111538c5dc9  /tmp/source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .
          git rm .github/workflows/tmp-sync-064c5b0-20260905.yml
          git config user.name 'Vitalii'
          git config user.email '84464769+Pokhyl@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md docs/ENGINEERING_HISTORY.md n8n/workflows/WF03-natural-edge-voice.json n8n/workflows/WF04-visual-sourcing.json services/media-worker/src/audio-duration-normalization.mjs services/media-worker/src/server.mjs services/media-worker/src/visual-discovery.mjs tests/audio_duration_tail_pad_regression.mjs tests/visual_discovery_bounded_query_recovery_regression.mjs tests/wf04_exact_phrase_exposure_regression.mjs
          git diff --cached --check
          git commit -m 'fix: stabilize near-floor audio and exact visual exposure'
          git push origin HEAD:rebuild/agentic-editor-v5
