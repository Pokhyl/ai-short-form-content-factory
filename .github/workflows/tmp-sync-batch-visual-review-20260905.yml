name: Temporary batch visual review source sync

on:
  push:
    branches:
      - rebuild/agentic-editor-v5
    paths:
      - .github/workflows/tmp-sync-batch-visual-review-20260905.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 1
      - name: Apply tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://publisher.hodor.com.pl/chat-share-4d7f9c2a/sync-batch-visual-review-20260905.tar.gz -o /tmp/source.tar.gz
          echo '27bd6444dcce91653008751c604d46f9544556a6bffaabce601245cc24b93a63  /tmp/source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .
          git rm .github/workflows/tmp-sync-batch-visual-review-20260905.yml
          git config user.name 'Vitalii'
          git config user.email '84464769+Pokhyl@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md docs/ENGINEERING_HISTORY.md n8n/workflows/WF04-visual-sourcing.json tests/wf04_photo_relevance_gate_regression.mjs
          git diff --cached --check
          git commit -m 'fix: batch exact-beat visual review'
          git push origin HEAD:rebuild/agentic-editor-v5
