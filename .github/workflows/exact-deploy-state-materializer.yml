name: Exact deployment state materializer

on:
  push:
    branches:
      - transport/deploy-state-20260908

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact voice-budget deployment checkpoint
        shell: bash
        run: |
          set -euo pipefail
          patch_ref="$GITHUB_SHA"
          git show "$patch_ref:.transport/deploy-state.patch" | tr -d '\r\n' | base64 -d | gzip -d > /tmp/voice-budget-deploy-state.patch
          test "$(sha256sum /tmp/voice-budget-deploy-state.patch | awk '{print $1}')" = 59e66c9939f7fffb49cbd90e490fd03c4088aa37bb4e94f173033d5ce89b3e13
          result_ref=refs/heads/transport/voice-budget-deployment-result-20260908
          if git ls-remote --exit-code --heads origin "$result_ref" >/dev/null 2>&1; then
            echo 'deployment result branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout --detach a839f9497bf794c1e74a395a155b83795ae8c5dc
          git apply --check /tmp/voice-budget-deploy-state.patch
          git apply /tmp/voice-budget-deploy-state.patch
          test "$(git hash-object docs/CURRENT_STATE_V5.md)" = 443e62d13258f83ed2ad2180a1dbd8e144b5def8
          git add docs/CURRENT_STATE_V5.md
          test "$(git write-tree)" = 9a5f165d316bf94176d2755efbbffa8a6f8ac299
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record voice-budget deployment'
          test "$(git rev-parse HEAD^)" = a839f9497bf794c1e74a395a155b83795ae8c5dc
          test "$(git rev-parse HEAD^{tree})" = 9a5f165d316bf94176d2755efbbffa8a6f8ac299
          echo "result_commit=$(git rev-parse HEAD)"
          echo "result_tree=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:"$result_ref"
