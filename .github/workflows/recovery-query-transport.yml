name: recovery-query-transport
on:
  push:
    branches:
      - tmp/recovery-query-20260906-1620
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .transport/recovery-query.patch.xz.b64 | xz -d > /tmp/recovery.patch
          echo 'e039917389bfe76c28bf72a24b86d4fc0ccbec29fd73c964e3708aefd52fd84e  /tmp/recovery.patch' | sha256sum -c -
      - name: Apply exact patch and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rebuild/agentic-editor-v5
          test "$(git rev-parse origin/rebuild/agentic-editor-v5)" = "470215fb9592195b36c34236bdd4b15f828eef87"
          git checkout --detach 470215fb9592195b36c34236bdd4b15f828eef87
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git am /tmp/recovery.patch
          test "$(git rev-parse HEAD^{tree})" = "2f31abf2903477acd2c19a243a72a1f77f1a19f1"
          node tests/visual_discovery_bounded_query_recovery_regression.mjs
          node tests/visual_discovery_semantic_anchor_regression.mjs
          node tests/visual_conflict_recovery_exact_query_regression.mjs
      - name: Fast-forward production branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/rebuild/agentic-editor-v5
