name: Temporary spoken/visual source sync

on:
  push:
    branches:
      - rebuild/agentic-editor-v5
    paths:
      - .github/workflows/tmp-sync-spoken-visual-20260905.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 1
      - name: Apply tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://publisher.hodor.com.pl/chat-share-4d7f9c2a/sync-spoken-visual-20260905-v2.tar.gz -o /tmp/source.tar.gz
          echo '7d9997f4f233cc348b1d56f71bda2e7d4a6efab25e9049d926929c73a0486c27  /tmp/source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .
          git rm .github/workflows/tmp-sync-spoken-visual-20260905.yml
          git config user.name 'Vitalii'
          git config user.email '84464769+Pokhyl@users.noreply.github.com'
          git add docs/CURRENT_STATE_V5.md docs/ENGINEERING_HISTORY.md n8n/workflows/WF02-plan-script-and-scenes.json n8n/workflows/WF03-natural-edge-voice.json n8n/workflows/WF04-visual-sourcing.json tests/wf04_photo_relevance_gate_regression.mjs tests/narration_speech_safety_regression.mjs
          git diff --cached --check
          git commit -m 'fix: reject unreviewed visuals and spoken separators'
          git push origin HEAD:rebuild/agentic-editor-v5
