name: exact-tree-transport-20260909

on:
  push:
    branches:
      - rebuild/editorial-core-20260908

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1dbfc2a7035dd6ad6458cbe3429fdf23d15d4473'
          EXPECTED_PATCH_SHA='f831f1671830515943972df610c3d3a57d4fe1544b25dd2e97058cca0f2bd142'
          EXPECTED_TREE='b56b07115876553c69d7a34067d921a9365f50c6'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git rm .github/workflows/exact-tree-transport-20260909.yml
          cat > /tmp/patch.b64 <<'EOF'

EOF
          base64 -d /tmp/patch.b64 | gunzip > /tmp/grounded-duration.patch
          test "$(sha256sum /tmp/grounded-duration.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA"
          git apply --index /tmp/grounded-duration.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: ground exact-duration narration rewrites'
          git push origin HEAD:rebuild/editorial-core-20260908
