name: transport inventory-first tree
on:
  push:
    branches:
      - transport/inventory-first-20260906-run
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact audited tree
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://publisher.hodor.com.pl/chat-share-4d7f9c2a/inventory-first-20260906.patch -o /tmp/inventory-first.patch
          echo '1bc0ec43eaf987b5e8932798cc34f09bd7f35ca5e229b44b88dc2cfeebf1ff2c  /tmp/inventory-first.patch' | sha256sum -c -
          git apply --check /tmp/inventory-first.patch
          git apply /tmp/inventory-first.patch
          rm -f .github/workflows/transport-inventory-first-20260906.yml
          git add -A
          test "$(git write-tree)" = "3cdf959ede9af8caec65b63016380a1bb5dc56c6"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'transport: materialize verified inventory-first tree'
          git push origin HEAD:transport/inventory-first-20260906-run
