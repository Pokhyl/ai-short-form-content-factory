name: Temporary WF01 source sync transport

on:
  push:
    branches:
      - tmp/wf01-source-sync-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply verified WF01 source sync
        shell: bash
        run: |
          set -euo pipefail
          expected=a8ab5f2c984a517e9176b29dcc4bb101270355f9
          expected_tree=c139a4fcce5c67dfcde8043bf51e0362140fc61b
          test "$(git rev-parse HEAD)" = "$expected"
          git config user.name Vitalii
          git config user.email 84464769+Pokhyl@users.noreply.github.com
          cat > /tmp/wf01.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/wf01.patch.gz.b64 | gzip -d > /tmp/wf01.patch
          git am /tmp/wf01.patch
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          node tests/wf01_n8n_orchestration_regression.mjs
          git diff --check HEAD^ HEAD
          git push origin HEAD:rebuild/agentic-editor-v5
