name: Temporary WF04 shortfall recovery transport

on:
  push:
    branches:
      - tmp/wf04-shortfall-recovery-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply verified WF04 shortfall recovery patch
        shell: bash
        run: |
          set -euo pipefail
          expected=c0492f97627d0d894276bebc1f14a018277d281e
          expected_tree=9c2eee8c588a365226303477d3140ef021d5e076
          test "$(git rev-parse HEAD)" = "$expected"
          git config user.name Vitalii
          git config user.email 84464769+Pokhyl@users.noreply.github.com
          cat > /tmp/fix.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          git am /tmp/fix.patch
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/wf04_photo_relevance_gate_regression.mjs
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/wf04_global_no_repeat_recovery_regression.mjs
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/visual_conflict_recovery_exact_query_regression.mjs
          git diff --check HEAD^ HEAD
          git push origin HEAD:rebuild/agentic-editor-v5
