name: Temporary structured output transport

on:
  push:
    branches:
      - tmp/structured-output-20260906

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/agentic-editor-v5
          fetch-depth: 0
      - name: Apply verified structured-output patch
        shell: bash
        run: |
          set -euo pipefail
          expected=5d0398b65d6c63764f24a9441c5785c190753b50
          expected_tree=57a7ac22d62ce0f36dffba47e7d584ef09b9a2a9
          test "$(git rev-parse HEAD)" = "$expected"
          git config user.name Vitalii
          git config user.email 84464769+Pokhyl@users.noreply.github.com
          cat > /tmp/fix.patch.xz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/fix.patch.xz.b64 | xz -d > /tmp/fix.patch
          git am /tmp/fix.patch
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/model_gateway_bounded_recovery_regression.mjs
          docker run --rm -v "$PWD":/repo:ro -w /repo node:22-bookworm-slim node tests/model_gateway_structured_output_regression.mjs
          git diff --check HEAD^ HEAD
          git push origin HEAD:rebuild/agentic-editor-v5
