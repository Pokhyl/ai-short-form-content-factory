name: semantic-gate-transport
on:
  push:
    branches:
      - tmp/semantic-gate-20260906-1459
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/semantic-gate.part1 .transport/semantic-gate.part2 .transport/semantic-gate.part3 .transport/semantic-gate.part4 > /tmp/semantic.b64
          base64 -d /tmp/semantic.b64 | xz -d > /tmp/semantic.patch
          echo '5abed81f312b9b2e9576477c2cee72c352a30e5cb5a2ef1db4265a1c8b866874  /tmp/semantic.patch' | sha256sum -c -
      - name: Apply exact commit and test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rebuild/agentic-editor-v5
          test "$(git rev-parse origin/rebuild/agentic-editor-v5)" = "288a90043b81b9fcc6fa07fed199d8308d62a668"
          git checkout --detach 288a90043b81b9fcc6fa07fed199d8308d62a668
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git am /tmp/semantic.patch
          test "$(git rev-parse HEAD^{tree})" = "7513968d9c7311e0ce0209ce37ca4b016e2572e1"
          node tests/visual_discovery_semantic_anchor_regression.mjs
          node tests/wf04_photo_relevance_gate_regression.mjs
          node tests/wf04_global_no_repeat_recovery_regression.mjs
          node tests/model_gateway_structured_output_regression.mjs
          node tests/visual_segmentation_regression.mjs
      - name: Fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/rebuild/agentic-editor-v5
