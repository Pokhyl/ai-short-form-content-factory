name: shorts-v2

services:
  postgres:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: shorts_factory
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/02-provider-budget.sql:/docker-entrypoint-initdb.d/02-provider-budget.sql:ro
      - ./db/03-provider-budget-policy.sql:/docker-entrypoint-initdb.d/03-provider-budget-policy.sql:ro
      - ./db/04-jobs.sql:/docker-entrypoint-initdb.d/04-jobs.sql:ro
      - ./db/05-research-evidence.sql:/docker-entrypoint-initdb.d/05-research-evidence.sql:ro
      - ./db/06-script-storyboard.sql:/docker-entrypoint-initdb.d/06-script-storyboard.sql:ro
      - ./db/07-voiceover.sql:/docker-entrypoint-initdb.d/07-voiceover.sql:ro
      - ./db/08-alignment.sql:/docker-entrypoint-initdb.d/08-alignment.sql:ro
      - ./db/09-visuals.sql:/docker-entrypoint-initdb.d/09-visuals.sql:ro
      - ./db/10-render-qa.sql:/docker-entrypoint-initdb.d/10-render-qa.sql:ro
      - ./db/11-voiceover-candidate-reuse.sql:/docker-entrypoint-initdb.d/11-voiceover-candidate-reuse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts -d shorts_factory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  media-worker:
    build:
      context: ./services/media-worker
    volumes:
      - media_data:/data
      - ./.cache/whisper/ggml-small.bin:/models/ggml-small.bin:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/healthz', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest@sha256:e0027a772aeeea55bf642256aae6fb3344ffa5f25ca665898c2ea821101334c4
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      TZ: Europe/Warsaw
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read()"
        ]
      interval: 10s
      timeout: 4s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  searxng_cache:
